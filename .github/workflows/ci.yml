#
# On every push and pull request: license headers, unit tests, debug build.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Full history and tags for the version (git describe). A pull request builds its
      # own last commit, so the version names a commit that is on its branch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: License headers
        run: sh scripts/check-license-headers.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug build
        run: ./gradlew --console=plain testDebugUnitTest assembleDebug

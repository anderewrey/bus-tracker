#
# On every push and pull request: license headers, unit tests and a debug build, whose APKs are
# kept on the run's page. On a push to main: also the release build of the official app,
# published as a GitHub release (tag build-<versionCode>) for Obtainium. DESIGN.md §8.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The app's key (secrets set by the owner). Without them, builds are signed with a
      # throwaway debug key and main publishes nothing.
      SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
      ORG_GRADLE_PROJECT_busTrackerKeystorePassword: ${{ secrets.SIGNING_PASSWORD }}
      MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      # Full history and tags for the version (git describe). A pull request builds its
      # own last commit, so the version names a commit that is on its branch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: License headers
        run: sh scripts/check-license-headers.sh

      - name: App key
        if: env.SIGNING_KEYSTORE != ''
        run: |
          echo "$SIGNING_KEYSTORE" | base64 -d > "$RUNNER_TEMP/app.jks"
          echo "ORG_GRADLE_PROJECT_busTrackerKeystore=$RUNNER_TEMP/app.jks" >> "$GITHUB_ENV"

      - name: Main needs the app key
        if: env.MAIN_PUSH == 'true' && env.SIGNING_KEYSTORE == ''
        run: |
          echo "::error::SIGNING_KEYSTORE and SIGNING_PASSWORD are not set: no release without the app's key"
          exit 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug build
        run: ./gradlew --console=plain testDebugUnitTest assembleDebug

      - name: Release build
        if: env.MAIN_PUSH == 'true'
        run: ./gradlew --console=plain assembleRelease

      # Same names as local builds: bus-tracker.apk for phones, bus-tracker-emulator.apk.
      - name: Name the APKs
        run: |
          type=$([ "$MAIN_PUSH" = true ] && echo release || echo debug)
          dir=app/build/outputs/apk/$type
          mkdir out
          cp "$dir/app-arm64-v8a-$type.apk" out/bus-tracker.apk
          cp "$dir/app-x86_64-$type.apk" out/bus-tracker-emulator.apk
          jq -r '.elements[0] | "\(.versionCode) \(.versionName)"' "$dir/output-metadata.json" > out/version.txt
          cat out/version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/
          retention-days: 30

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apks

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          read code name < version.txt
          gh release create "build-$code" bus-tracker.apk bus-tracker-emulator.apk \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$name" --notes "$MESSAGE"

#
# On every push and pull request: license headers, unit tests and a debug build, whose APKs are
# kept on the run's page. On a push to main: also the release build of the official app,
# published as a GitHub pre-release (tag build-<versionCode>). "Run workflow"
# (Actions tab) promotes one of those pre-releases to an official version: same commit, built
# again under the version's name. DESIGN.md §8.
name: CI

on:
  push:
  pull_request:
  # The "Run workflow" button: promotes a tested pre-release to an official version.
  workflow_dispatch:
    inputs:
      build:
        description: "Build (empty = latest pre-release)"
        required: false
      version:
        description: "Version (empty = next)"
        required: false

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # The app's key (secrets set by the owner). Without them, builds are signed with a
      # throwaway debug key and main publishes nothing.
      SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
      ORG_GRADLE_PROJECT_busTrackerKeystorePassword: ${{ secrets.SIGNING_PASSWORD }}
      MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      # Full history and tags for the version (git describe). A pull request builds its
      # own last commit, so the version names a commit that is on its branch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: License headers
        run: sh scripts/check-license-headers.sh

      - name: App key
        if: env.SIGNING_KEYSTORE != ''
        run: |
          echo "$SIGNING_KEYSTORE" | base64 -d > "$RUNNER_TEMP/app.jks"
          echo "ORG_GRADLE_PROJECT_busTrackerKeystore=$RUNNER_TEMP/app.jks" >> "$GITHUB_ENV"

      - name: Main needs the app key
        if: env.MAIN_PUSH == 'true' && env.SIGNING_KEYSTORE == ''
        run: |
          echo "::error::SIGNING_KEYSTORE and SIGNING_PASSWORD are not set: no release without the app's key"
          exit 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug build
        run: ./gradlew --console=plain testDebugUnitTest assembleDebug

      - name: Release build
        if: env.MAIN_PUSH == 'true'
        run: ./gradlew --console=plain assembleRelease

      # Same names as local builds: bus-tracker.apk for phones, bus-tracker-emulator.apk.
      - name: Name the APKs
        run: |
          type=$([ "$MAIN_PUSH" = true ] && echo release || echo debug)
          dir=app/build/outputs/apk/$type
          mkdir out
          cp "$dir/app-arm64-v8a-$type.apk" out/bus-tracker.apk
          cp "$dir/app-x86_64-$type.apk" out/bus-tracker-emulator.apk
          jq -r '.elements[0] | "\(.versionCode) \(.versionName)"' "$dir/output-metadata.json" > out/version.txt
          cat out/version.txt
          # The release notes: on main, first what Run workflow would make of it (the input
          # descriptions can't say it: they are fixed text); then the commit's message.
          : > out/notes.txt
          if [ "$MAIN_PUSH" = true ]; then
            read code name < out/version.txt
            last=$(git describe --tags --abbrev=0 --match "[0-9]*" 2>/dev/null || echo 0.0)
            next=$(echo "$last" | awk -F. '{ print $1 "." $2 + 1 }')
            printf '%s\n\n' "To make this build version $next: Run workflow with empty fields while it is the latest pre-release, or with build build-$code." >> out/notes.txt
          fi
          git log -1 --format=%B >> out/notes.txt

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/
          retention-days: 30

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apks

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read code name < version.txt
          gh release create "build-$code" bus-tracker.apk bus-tracker-emulator.apk \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$name" --notes-file notes.txt \
            --prerelease

  # "Run workflow": the version tag goes on the pre-release's commit, that commit is built again
  # so the app is named after the version (e.g. "0.17"), its APKs replace the pre-release's,
  # and the release takes the version's name and becomes the latest one. The code is the one
  # tested; only the name and the versionCode change, so the phone takes it as an update.
  promote:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
      ORG_GRADLE_PROJECT_busTrackerKeystorePassword: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Which build, which version
        env:
          BUILD: ${{ inputs.build }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          [ -n "$SIGNING_KEYSTORE" ] || { echo "::error::SIGNING_KEYSTORE and SIGNING_PASSWORD are not set"; exit 1; }
          if [ -z "$BUILD" ]; then
            BUILD=$(gh release list -R "$GITHUB_REPOSITORY" --limit 50 --json tagName,isPrerelease \
              --jq '[.[] | select(.isPrerelease)][0].tagName // empty')
            [ -n "$BUILD" ] || { echo "::error::No pre-release to promote"; exit 1; }
          fi
          [ "$(gh release view "$BUILD" -R "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = true ] \
            || { echo "::error::$BUILD is not a pre-release"; exit 1; }
          sha=$(git rev-list -n 1 "refs/tags/$BUILD")
          if [ -z "$VERSION" ]; then
            last=$(git describe --tags --abbrev=0 --match "[0-9]*" "$sha" 2>/dev/null || echo 0.0)
            VERSION=$(echo "$last" | awk -F. '{ print $1 "." $2 + 1 }')
          fi
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$' \
            || { echo "::error::Version $VERSION: digits and dots, e.g. 0.17"; exit 1; }
          if git rev-parse -q --verify "refs/tags/$VERSION" > /dev/null; then
            echo "::error::Tag $VERSION already exists"; exit 1
          fi
          name=$(gh release view "$BUILD" -R "$GITHUB_REPOSITORY" --json name --jq .name)
          # The tag is made here and pushed only once the build has worked.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q "$sha"
          git tag -a "$VERSION" "$sha" -m "Bus Tracker $VERSION"
          { echo "BUILD=$BUILD"; echo "VERSION=$VERSION"; echo "NAME=$name"; } >> "$GITHUB_ENV"

      - name: App key
        run: |
          echo "$SIGNING_KEYSTORE" | base64 -d > "$RUNNER_TEMP/app.jks"
          echo "ORG_GRADLE_PROJECT_busTrackerKeystore=$RUNNER_TEMP/app.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # GITHUB_REF is refs/heads/main: the official app, as on a push to main.
      - name: Release build under the version's name
        run: |
          ./gradlew --console=plain assembleRelease
          dir=app/build/outputs/apk/release
          mkdir out
          cp "$dir/app-arm64-v8a-release.apk" out/bus-tracker.apk
          cp "$dir/app-x86_64-release.apk" out/bus-tracker-emulator.apk
          jq -r '.elements[0] | "\(.versionCode) \(.versionName)"' "$dir/output-metadata.json" | tee out/version.txt

      - name: Promote
        run: |
          set -eu
          read code shown < out/version.txt
          git push origin "refs/tags/$VERSION"
          gh release upload "$BUILD" out/bus-tracker.apk out/bus-tracker-emulator.apk -R "$GITHUB_REPOSITORY" --clobber
          { echo "Version $VERSION: build $NAME ($BUILD), built again under the version's name (versionCode $code)."; echo
            gh release view "$BUILD" -R "$GITHUB_REPOSITORY" --json body --jq .body | sed '/^To make this build version /,+1d'; } > notes.txt
          gh release edit "$BUILD" -R "$GITHUB_REPOSITORY" --title "$VERSION" --notes-file notes.txt \
            --prerelease=false --latest
          echo "$BUILD ($NAME) is now version $VERSION; the app shows $shown"
          { echo "## Version $VERSION"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Promoted pre-release | $BUILD ($NAME) |"
            echo "| Name in the app | $shown |"
            echo "| versionCode | $code |"
            echo "| Release | $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$BUILD |"
          } >> "$GITHUB_STEP_SUMMARY"
